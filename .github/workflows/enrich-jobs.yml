# Every five minutes, asks the published app to read a batch of jobs with the AI (see src/lib/ingest/enrich.ts), so the exact fit of every job
# is ready before anybody looks. The day's budget of readings (JOB_FACTS_PER_DAY, set in the host) is what limits the total.
#
# To turn it on (after the app is published): in GitHub, Settings > Secrets and variables > Actions, add
#   SITE_URL     https://your-domain.example   (no slash at the end)
#   CRON_SECRET  the same value as the CRON_SECRET of the host
# Until both exist the job does nothing. GitHub pauses scheduled workflows of a repository that has had no activity for 60 days.
name: Read jobs with the AI

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the app to read a batch
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET are not set: nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 -X POST "$SITE_URL/api/admin/enrich-jobs" -H "Authorization: Bearer $CRON_SECRET"
